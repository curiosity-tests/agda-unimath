name: agda-unimath CI
run-name: "agda-unimath CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  # To run this workflow manually
  workflow_dispatch:
    inputs:
      ref:
        description: the repository ref to build
        required: true
        default: master

      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
# Cancel previous runs of the same branch
concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.run_id }}'
  cancel-in-progress: true

jobs:
  typecheck:
    if:
      ${{ github.event_name == 'workflow_dispatch' || github.event_name ==
      'push' || (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agda: ['2.8.0']
    steps:
      - name: Checkout our repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          path: repo
      - name: Assert instrumentation is live
        continue-on-error: true
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
      - name: Setup Agda ${{ matrix.agda }} (prebuilt)
        uses: ./repo/.github/actions/setup-agda
        with:
          agda-version: ${{ matrix.agda }}

      - uses: actions/cache/restore@v4
        id: cache-agda-formalization
        name: Restore Agda formalization cache
        with:
          path: repo/_build
          key:
            ${{ runner.os }}-check-${{ github.ref }}-${{ matrix.agda }}-${{
            hashFiles('repo/src/**') }}
          restore-keys: |
            ${{ runner.os }}-check-${{ github.ref }}-${{ matrix.agda }}-
            ${{ runner.os }}-check-refs/heads/master-${{ matrix.agda }}-

      - name: Typecheck library
        run: |
          cd repo
          agda --version
          make check

      - name: Save Agda build cache
        uses: actions/cache/save@v4
        with:
          path: repo/_build
          key: '${{ steps.cache-agda-formalization.outputs.cache-primary-key }}'

  # We're only running the linkcheck renderer, so we don't need to install
  # any other packages; that gives a warning during building, but doesn't
  # fail the build.
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          path: repo
      - name: Assert instrumentation is live
        continue-on-error: true
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.34'

      - uses: baptiste0928/cargo-install@v3
        with:
          crate: mdbook-linkcheck
          version: '0.7.7'

      # Install Python and friends for website generation only where needed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          check-latest: true
          cache: 'pip'

      - run: python3 -m pip install -r repo/scripts/requirements.txt

      # Tell mdbook to use only the linkcheck backend
      - name: Check website links and bibtex references
        env:
          MDBOOK_OUTPUT: '{"linkcheck":{}}'
        run: |
          cd repo
          make SKIPAGDA=1 SKIPAUX=1 website

  pre-commit:
    if: false   # racecar: scan/report job, not a build
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        continue-on-error: true
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          check-latest: true
          cache: 'pip'

      - run: python3 -m pip install -r scripts/requirements.txt

      - uses: pre-commit/action@v3.0.1
